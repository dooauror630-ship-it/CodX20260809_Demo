[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 120
exclude = [
    "backend/instance",
    "backend/migrations/versions",
    "frontend/dist",
    "frontend/node_modules",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
